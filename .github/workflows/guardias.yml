# Las guardias, otra vez, en la nube.
#
# El hook de tu maquina es la primera cerradura. Esta es la segunda: corre
# aunque alguien haya usado `--no-verify` o haya subido desde otra computadora.
# Si esto sale rojo, no se publica.

name: Guardias

on:
  push:
    branches: ['**']
  pull_request:

# Si empujas dos veces seguidas, la corrida vieja se cancela.
concurrency:
  group: guardias-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardias:
    name: Revisar antes de publicar
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # A nivel de job: si se pusiera dentro del paso, la condicion `if:` de ese
    # mismo paso se evalua ANTES que su propio `env:` y siempre saldria vacia —
    # el paso se saltaria siempre y la sesion nunca se escribiria.
    env:
      GUARDIAS_SESION: ${{ secrets.GUARDIAS_SESION }}

    steps:
      - name: Bajar el codigo
        uses: actions/checkout@v4
        with:
          # Historial completo: el enrutador compara contra la rama base.
          fetch-depth: 0

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar el navegador de pruebas
        run: npx playwright install --with-deps chromium

      # LA SESION NO VIAJA A LA NUBE, y es correcto que no viaje: es una sesion
      # abierta y está en .gitignore. Por eso aqui se guarda desde un secreto
      # del repositorio, si lo configuraste.
      #
      # Para configurarlo: en GitHub → Settings → Secrets and variables →
      # Actions → New repository secret, con nombre GUARDIAS_SESION y como
      # contenido el archivo guardias.sesion.json completo.
      - name: Preparar la sesion (si hay secreto)
        if: env.GUARDIAS_SESION != ''
        run: printf '%s' "$GUARDIAS_SESION" > guardias.sesion.json

      # OJO: para que este paso funcione, neron-guardias tiene que ser una
      # dependencia de verdad del proyecto (publicada en GitHub e instalada con
      # npm). Si lo estas usando desde una carpeta vecina de tu computadora, la
      # nube no puede verla y este paso fallara: publica el repositorio primero.
      #
      # Sin el secreto de la sesion, las guardias de pantalla no pueden entrar.
      # En ese caso se corre lo que SI se puede revisar sin navegador (tipos,
      # consistencia y los borrados en el codigo) y se dice con todas sus
      # letras que las pantallas quedaron sin revisar.
      - name: Correr las guardias
        run: |
          if [ -f guardias.sesion.json ]; then
            npm run guardias -- --todo --motivo "revision en la nube"
          else
            echo "::warning::Sin GUARDIAS_SESION: las pantallas no se revisan en la nube, solo el codigo."
            npm run guardias -- --todo --sin-navegador --motivo "revision en la nube (solo codigo)"
          fi

      - name: Guardar el reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-de-guardias
          path: guardias/
          retention-days: 14
          if-no-files-found: ignore
